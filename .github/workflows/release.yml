name: Build Releases

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: # Allow running manually for testing

jobs:
  build:
    name: Build for ${{ matrix.system }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest       # Standard x86_64 runner
            system: x86_64-linux
          - os: ubuntu-24.04-arm    # Standard ARM64 runner
            system: aarch64-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build with Zig
        run: zig build -Doptimize=ReleaseSafe

      - name: Prepare binary for upload
        run: |
          mkdir -p dist
          cp zig-out/bin/meowkey dist/meowkey-${{ matrix.system }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meowkey-${{ matrix.system }}
          path: dist/meowkey-${{ matrix.system }}

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # Required to create a release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true # Puts all downloaded files into the same directory

      - name: Extract Release Notes
        id: extract_notes
        run: |
          # Extract everything under the current version tag up to the next ## header
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v} # Remove 'v' prefix if present
          awk -v ver="$VERSION" '$0 ~ "^## \\[" ver "\\]" {flag=1; next} /^## \[/ {flag=0} flag' CHANGELOG.md > release_notes.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release_notes.txt
          files: artifacts/meowkey-*
          draft: false
          prerelease: false
