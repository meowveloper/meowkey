name: Build Releases

on:
  push:
    branches:
      - 'v*.*.*'
  workflow_dispatch: # Allow running manually for testing

jobs:
  build:
    name: Build for ${{ matrix.system }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest       # Standard x86_64 runner
            system: x86_64-linux
          - os: ubuntu-24.04-arm    # Standard ARM64 runner
            system: aarch64-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: master

      - name: Build with Zig
        run: zig build -Doptimize=ReleaseSafe

      - name: Prepare binary for upload
        run: |
          mkdir -p dist
          cp zig-out/bin/meowkey dist/meowkey-${{ matrix.system }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meowkey-${{ matrix.system }}
          path: dist/meowkey-${{ matrix.system }}

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true # Puts all downloaded files into the same directory

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: artifacts/meowkey-*
          draft: false
          prerelease: false
